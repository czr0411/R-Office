<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. 修改這裡：這會變成瀏覽器分頁上顯示的 App 名稱 -->
    <title>我的專屬自訂 Office</title> 

    <style>
        /* 移除網頁邊距，讓視窗填滿 */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* 自訂的頂部導覽列樣式 */
        .app-header {
            height: 50px; background: #2b579a; color: white;
            display: flex; align-items: center; padding: 0 20px; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-size: 18px;
        }
        /* LibreOffice WASM 渲染畫布區塊 */
        #office-canvas {
            width: 100%; height: calc(100% - 50px); background: #f3f3f3;
        }
    </style>
</head>
<body>

    <!-- 2. 修改這裡：網頁上方藍色導覽列顯示的 App 名稱 -->
    <div class="app-header" id="app-title">✨ 我的專屬自訂 Office</div>

    <!-- 內嵌開源社群（Allotropia）官方實際維護的 LibreOffice WASM 穩定版網址 -->
  <iframe id="office-canvas" src="https://allotropia.gitlab.io/lolative/demo/index.html" frameborder="0"></iframe>

</body>
</html>
